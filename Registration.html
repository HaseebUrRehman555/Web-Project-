  <header class="page-header">
    <h1>Club Registration</h1>
    <p>Fill in the form below to register for the club trials.</p>
  </header>

  <main>
    <form class="form-box" id="signupForm">

      <label for="name">Name</label>
      <input class="box" type="text" id="name" name="name" placeholder="Write your name" required>

      <label>Gender</label>
      <div class="radios">
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
      </div>

      <label for="email">Email</label>
      <input class="box" type="email" id="email" name="email" placeholder="Enter your email address" required>

      <label for="address">Address</label>
      <input class="box" type="text" id="address" name="address" placeholder="Enter your Address" required>

      <label for="password">Password</label>
      <input class="box" type="password" id="password" name="password" placeholder="Enter at least 8 characters" required>

      <button class="btn" type="submit">Submit</button>

    </form>
  </main>
